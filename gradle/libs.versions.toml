[versions]
agp = "9.4.0"
coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
firebaseBom = "34.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.20"
kotlinxSerializationJson = "1.11.0"
navigationCompose = "2.10.1"
composeBom = "2026.09.00"
gms = "4.5.0"
crashlytics = "3.0.8"
# Credential Manager: the single system entry point for Google sign-in, saved
# passwords and passkeys. Replaces the deprecated GoogleSignInClient/one-tap
# APIs. Deliberately the same API surface passkeys use, so adding
# GetPublicKeyCredentialOption later is an extra option on the same request
# rather than a second sign-in stack.
credentials = "1.6.0"
# Supplies GetGoogleIdOption / GetSignInWithGoogleOption and parses the returned
# credential Bundle into a GoogleIdTokenCredential. Depends on androidx
# credentials 1.6.0 - keep the two in step when upgrading.
googleid = "1.2.1"
# Adds Task.await(), so Firebase's callback APIs can be consumed as suspend
# functions instead of nested listeners.
coroutinesPlayServices = "1.10.2"
# Sentry Android SDK. Used on the free "Developer" plan - SDK only, no Sentry
# Gradle plugin, so nothing in the build talks to Sentry and no auth token is
# needed for a clean checkout to compile.
sentry = "8.56.0"
timber = "5.0.1"
# --- Dependency injection -------------------------------------------------
# Dagger Hilt. Replaces the hand-rolled ServiceLocator: the object graph is
# declared once in @Modules and validated at *compile* time, and every
# injection site (Application, Activity, ViewModel) is generated rather than
# hand-wired. It is also what makes a future :feature:auth Gradle module cheap
# - that module ships its own @Module and the app never learns about it.
hilt = "2.60.1"
# hiltViewModel() for Compose: resolves a @HiltViewModel from the current
# NavBackStackEntry, so a screen gets the correctly scoped ViewModel without
# the call site naming a factory.
androidxHilt = "1.4.0"
# Kotlin Symbol Processing, which runs Hilt's annotation processor. KSP rather
# than kapt: kapt generates a Java stub for every Kotlin file in the module
# before the processor even runs. Since KSP 2.3.0 its version is independent of
# the Kotlin version, so the two no longer have to be bumped in lockstep.
ksp = "2.3.12"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
# viewModel() for Compose. Arrives transitively via navigation-compose, but is
# declared explicitly because screens call it directly - an implicit dependency
# would break silently if navigation ever dropped it.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# --- Authentication -------------------------------------------------------
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
# Backs Credential Manager with Google Play services on API < 34. Without it,
# getCredential() finds no provider on most devices in the field.
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
# runTest + StandardTestDispatcher, so ViewModel coroutines can be driven
# deterministically instead of being waited on with sleeps.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesPlayServices" }
# Umbrella artifact: sentry-android-core + sentry-android-ndk + sentry-android-replay
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
# Bridges Timber into Sentry. Auto-installed by SentryAndroid.init when present on
# the classpath, so it needs no wiring beyond being declared here.
sentry-android-timber = { module = "io.sentry:sentry-android-timber", version.ref = "sentry" }
# Compose tracing. Pulls sentry-android-navigation transitively, which is what
# provides the NavController listener behind withSentryObservableEffect().
sentry-compose-android = { module = "io.sentry:sentry-compose-android", version.ref = "sentry" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
# --- Dependency injection -------------------------------------------------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
# The annotation processor, run through KSP - see the `ksp` plugin below.
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "gms" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

